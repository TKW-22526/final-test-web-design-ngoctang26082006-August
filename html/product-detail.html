<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- File JS -->
    <script src="../js/lib.js"></script>
</head>

<body>

    <div class="container mt-4">

        <!-- Điều hướng -->
        <nav>
            <a href="page6.html" class="text-decoration-none"> Trang chủ </a>
            <span>/ Chi tiết sản phẩm</span>
        </nav>

        <hr>

        <div class="row mt-4">

            <!-- Ảnh -->
            <div class="col-md-5">
                <img id="img-detail" class="img-fluid border" alt="Ảnh sản phẩm">
            </div>

            <!-- Thông tin -->
            <div class="col-md-7">
                <h2 id="name-detail" class="fw-bold"></h2>
                <h4 id="price-detail" class="text-danger my-3"></h4>

                <p class="fw-bold"> Mô tả sản phẩm: </p>
                <p id="desc-detail" class="text-secondary"></p>

                <!-- ĐÃ CẬP NHẬT: Thêm sự kiện click gọi hàm thêm vào giỏ hàng -->
                <button id="btn-add-to-cart" class="btn btn-primary mt-3">
                    Thêm Vào Giỏ Hàng
                </button>
            </div>

        </div>

    </div>

    <script>
        // Lấy id từ URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const productId = urlParams.get("id");

        // Tìm sản phẩm
        const allProducts = [...productList, ...petProducts];
        const product = allProducts.find(item => item.id == productId);

        if (product) {
            document.getElementById("img-detail").src = product.image;
            document.getElementById("name-detail").innerText = product.name;
            document.getElementById("price-detail").innerText = "Giá: " + product.price;
            document.getElementById("desc-detail").innerText = product.desc;
            
            console.log("Đã đổ xong mô tả:", product.desc);

            // ĐÃ THÊM: Gán sự kiện click cho nút Thêm vào giỏ khi tìm thấy sản phẩm
            document.getElementById("btn-add-to-cart").onclick = function() {
                addToCart(product.id, product.name, product.price, product.image);
            };
        }

        // ĐÃ THÊM: Hàm xử lý thêm vào giỏ hàng bằng LocalStorage
        function addToCart(id, name, price, image) {
            // Lấy danh sách giỏ hàng hiện tại hoặc tạo mảng mới nếu chưa có
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            
            // Kiểm tra xem sản phẩm này đã có trong giỏ hàng chưa
            let itemIndex = cart.findIndex(item => item.id === id);
            
            // Do file chi tiết nằm trong thư mục con (ví dụ: html/product-detail.html),
            // đường dẫn ảnh "product.image" có thể chứa "../asset/..."
            // Chúng ta chuẩn hóa lại đường dẫn để khi trang index.html hay cart.html đọc đều không bị lỗi hiển thị.
            let cleanImage = image;
            if (cleanImage.startsWith("../")) {
                cleanImage = cleanImage.replace("../", "");
            }

            if (itemIndex > -1) {
                // Nếu có rồi thì tăng số lượng lên 1
                cart[itemIndex].quantity += 1;
            } else {
                // Nếu chưa có thì chèn đối tượng mới vào
                cart.push({
                    id: id,
                    name: name,
                    price: price,
                    image: cleanImage,
                    quantity: 1
                });
            }
            
            // Lưu mảng giỏ hàng mới cập nhật trở lại localStorage
            localStorage.setItem("cart", JSON.stringify(cart));
            
            // Hiển thị thông báo thành công cho người dùng
            alert(`🎉 Đã thêm thành công "${name}" vào giỏ hàng!`);
        }
    </script>

</body>

</html>

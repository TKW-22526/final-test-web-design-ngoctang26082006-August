<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - MeoIsTheBest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            /* Đổi sang màu nền kem be sáng sang trọng */
            background: #FDFBF7; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            /* Đổ bóng nhẹ tone đỏ nâu trầm tạo độ sâu mềm mại */
            box-shadow: 0 10px 30px rgba(128, 0, 32, 0.08); 
            border: 1px solid #F5EFEB;
        }

        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            /* Đổi logo sang màu đỏ đô cổ điển quý phái */
            color: #800020; 
            letter-spacing: -0.5px;
        }

        .slogan {
            text-align: center;
            margin-bottom: 25px;
            color: #7A6F68;
            font-size: 14px;
        }

        .form-label {
            color: #4A3E3D;
            font-weight: 600;
        }

        .form-control {
            height: 50px;
            border: 1px solid #E6DCD3;
            background-color: #FAFAf9;
        }

        .form-control:focus {
            border-color: #800020;
            box-shadow: 0 0 0 0.25rem rgba(128, 0, 32, 0.15);
        }

        /* Nút đăng nhập tone đỏ đô hoàng gia */
        .btn-login {
            background: #800020;
            color: white;
            height: 50px;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background: #5C0017;
            color: white;
            transform: translateY(-1px);
        }

        .google-btn {
            border: 1px solid #E6DCD3;
            height: 50px;
            font-weight: bold;
            color: #4A3E3D;
            background: white;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            background: #FAFAf9;
            border-color: #A3968E;
        }

        /* Link đăng ký */
        .signup-text a {
            color: #800020;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        /* Nút quay về trang chủ */
        .back-home a {
            text-decoration: none;
            color: #800020;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .back-home a:hover {
            color: #5C0017;
            letter-spacing: -0.2px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            🐾 MeoIsTheBest
        </div>

        <div class="slogan">
            Đăng nhập để khám phá thế giới mèo
        </div>

        <form id="loginForm">

            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="btn btn-login w-100">
                Đăng nhập
            </button>

        </form>

        <hr style="color: #E6DCD3;">

        <button class="btn google-btn w-100">
            <i class="fab fa-google" style="color: #EA4335; margin-right: 8px;"></i>
            Đăng nhập bằng Google
        </button>

        <div class="text-center signup-text mt-3 text-muted">
            Chưa có tài khoản?
            <a href="#">Đăng ký</a>
        </div>

        <div class="back-home">
            <a href="../index.html">
                ← Quay về Trang Chủ
            </a>
        </div>

    </div>

    <script>
        // Xử lý lưu trạng thái giả lập khi đăng nhập thành công
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();
            
            let user = document.getElementById("username").value.trim();
            
            // Lưu dữ liệu vào LocalStorage để trang chủ nhận diện
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("currentUser", user);

            alert("🎉 Đăng nhập thành công! Chào mừng bạn.");
            
            // Quay về trang chủ (sử dụng dấu ../ để chạy ra ngoài chính xác)
            window.location.href = "../index.html";
        });
    </script>

</body>

</html>
